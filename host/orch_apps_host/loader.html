<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shared page</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F3F5; --fg: #495159; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171A; --fg: #A3ABB5; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font: 15px/1.6 system-ui, sans-serif; color: var(--fg); }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  .msg { max-width: 34em; margin: 22vh auto 0; padding: 0 20px; }
</style>
<div class="msg" id="msg">Opening the shared page…</div>
<script>
const SHARE_ID = "__SHARE_ID__";
/*open*/
async function openSealed(keyText, blob, shareId) {
  // blob: "OAS1" | 12-byte nonce | AES-256-GCM ciphertext and tag; additional data "orch-apps:<id>"
  const b64 = keyText.replace(/-/g, "+").replace(/_/g, "/");
  const raw = Uint8Array.from(atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), c => c.charCodeAt(0));
  if (raw.length !== 32) throw new Error("key length");
  const magic = new TextDecoder().decode(blob.slice(0, 4));
  if (magic !== "OAS1") throw new Error("format");
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: blob.slice(4, 16), additionalData: new TextEncoder().encode("orch-apps:" + shareId) },
    key, blob.slice(16));
  return new TextDecoder().decode(plain);
}
/*open*/
(async () => {
  const msg = document.getElementById("msg");
  const say = (text) => { msg.textContent = text; };
  const keyText = new URLSearchParams(location.hash.slice(1)).get("k");
  if (!keyText) return say("This link is missing its key. Ask for the full link, including the part after #.");
  let res;
  try { res = await fetch("blob", { cache: "no-store", credentials: "omit" }); }
  catch { return say("The shared page could not be loaded. Check your connection and reload."); }
  if (res.status === 410) return say("This share has expired or was revoked.");
  if (!res.ok) return say("This share does not exist.");
  let html;
  try { html = await openSealed(keyText, new Uint8Array(await res.arrayBuffer()), SHARE_ID); }
  catch { return say("This link does not open this share. The key may be cut off; copy the whole link again."); }
  const frame = document.createElement("iframe");
  // no allow-same-origin: the page runs in its own opaque origin and cannot read this page's URL or its key
  frame.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-modals allow-downloads");
  frame.title = "Shared page";
  frame.srcdoc = html;
  msg.replaceWith(frame);
})();
</script>
</html>
