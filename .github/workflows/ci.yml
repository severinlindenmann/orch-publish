name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python project present
        id: proj
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no pyproject.toml yet (v1 layout): nothing to test"; fi
      - name: Sync
        if: steps.proj.outputs.present == 'true'
        run: uv sync --locked
      - name: Ruff check
        if: steps.proj.outputs.present == 'true'
        run: uv run ruff check .
      - name: Ruff format
        if: steps.proj.outputs.present == 'true'
        run: uv run ruff format --check .
      - name: Pytest
        if: steps.proj.outputs.present == 'true'
        run: uv run pytest -q tests
