[project]
name = "orch-publish"
version = "0.2.0"
description = "orch-publish: the v2 publish server (pubsrv)"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43"]

[project.scripts]
orch-publish = "pubsrv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pubsrv"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120

[tool.ruff]
line-length = 100
extend-exclude = ["pubsrv/relay_proto.py", "host", "cli"]
